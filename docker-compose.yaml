
services:
  backend:
    build:
      context: ./backend
    image: krishna-backend:1.0
    container_name: flask_backend
    ports:
      - "5000:5000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    image: krishna-frontend:1.0
    container_name: node_frontend
    ports:
      - "3000:3000"
    environment:
      BACKEND_URL: http://backend:5000
      PORT: 3000
    depends_on:
      - backend
    restart: unless-stopped